<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

        content="default-src 'self'; connect-src https://api.github.com; img-src 'self' data:; style-src 'self'; script-src 'self'; object-src 'none'; base-uri 'self'">
  <meta name="theme-color" content="#fcfcfb" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1a1a19" media="(prefers-color-scheme: dark)">
  <title>Luke Log</title>
  <link rel="manifest" href="manifest.webmanifest">

<body>
  <header class="topbar">
    <a href="#/" class="brand">Luke Log</a>
    <button id="sync-btn" class="sync" type="button" hidden></button>
  </header>

  <nav class="tabbar" aria-label="Main">
    <a href="#/" data-tab="today"><svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Today</a>
    <a href="#/episode" data-tab="episode"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-5 4 10 2-5h6"/></svg>Heart rate</a>
    <a href="#/standing" data-tab="standing"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="5" r="2"/><path d="M12 7v8M8 21l4-6 4 6M7 11h10"/></svg>Standing</a>
    <a href="#/history" data-tab="history"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6h16M4 12h16M4 18h10"/></svg>History</a>
    <a href="#/settings" data-tab="settings"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</a>
  </nav>

  <main id="view" tabindex="-1"></main>
  <div id="toast" role="status" aria-live="polite" hidden></div>

  <script src="vendor/js-yaml.min.js"></script>
  <script type="module" src="js/app.js"></script>
</body>
</html>
